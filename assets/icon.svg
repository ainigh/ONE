<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The ONE icon: a timer whose ring is the cycle itself, Opened (teal) and Closed (amber). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3530"/>
      <stop offset="1" stop-color="#101614"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#6fc3ad" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6fc3ad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="open" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be0cc"/>
      <stop offset="1" stop-color="#4fae96"/>
    </linearGradient>
    <linearGradient id="closed" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f2b46c"/>
      <stop offset="1" stop-color="#d98a3e"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2420"/>
      <stop offset="1" stop-color="#151b18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="3"/>
  <!-- crown -->
  <rect x="472" y="208" width="80" height="44" rx="14" fill="#4b5a53"/>
  <rect x="496" y="240" width="32" height="40" rx="8" fill="#4b5a53"/>
  <!-- face -->
  <circle cx="512" cy="552" r="262" fill="url(#face)" filter="url(#soft)"/>
  <!-- ring: right half Opened, left half Closed, a small gap at the joins -->
  <path d="M 524 330 A 222 222 0 0 1 524 774" fill="none" stroke="url(#open)" stroke-width="58" stroke-linecap="round"/>
  <path d="M 500 774 A 222 222 0 0 1 500 330" fill="none" stroke="url(#closed)" stroke-width="58" stroke-linecap="round"/>
  <!-- hand -->
  <line x1="512" y1="552" x2="512" y2="420" stroke="#e5eae6" stroke-width="22" stroke-linecap="round"/>
  <circle cx="512" cy="552" r="26" fill="#e5eae6"/>
</svg>
